<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@700;900&family=Cinzel:wght@700;900&family=Nunito:wght@700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: #080510;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Animated background */
  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,107,0,0.08) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 80%, rgba(30,144,255,0.08) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(155,48,255,0.05) 0%, transparent 60%);
    pointer-events:none; z-index:0;
  }

  /* Stars */
  .starfield { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star { position:absolute; border-radius:50%; background:white; animation:twinkle var(--dur,3s) infinite alternate; }
  @keyframes twinkle { 0%{opacity:.15} 100%{opacity:.9} }

  .container {
    position:relative; z-index:1;
    width:100%; max-width:420px;
    padding:0 20px 40px;
    display:flex; flex-direction:column; align-items:center;
  }

  /* HERO SECTION */
  .hero-section {
    width:100%; text-align:center;
    padding:40px 0 24px;
  }
  .hero-photo-wrap {
    position:relative; display:inline-block; margin-bottom:16px;
  }
  .hero-photo {
    width:100px; height:100px; border-radius:50%;
    object-fit:cover; object-position:center 15%;
    border:3px solid transparent;
    background: linear-gradient(#080510,#080510) padding-box,
                linear-gradient(135deg,#FF6B00,#FFD700,#00D4FF,#9B30FF) border-box;
    box-shadow: 0 0 30px rgba(255,107,0,0.3), 0 0 60px rgba(0,212,255,0.15);
  }
  /* Orbit ring */
  .orbit {
    position:absolute; inset:-10px; border-radius:50%;
    border:2px solid transparent;
    border-top-color:rgba(255,107,0,0.6);
    border-right-color:rgba(0,212,255,0.4);
    animation:orbit 4s linear infinite;
  }
  @keyframes orbit { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  .hero-name {
    font-family:'Bangers',cursive; font-size:36px; letter-spacing:4px;
    background:linear-gradient(135deg,#FF6B00,#FFD700,#00D4FF);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,107,0,0.4));
    line-height:1; margin-bottom:6px;
  }
  .hero-tagline {
    font-size:12px; font-weight:800; letter-spacing:3px;
    color:rgba(255,255,255,0.4); text-transform:uppercase;
  }

  /* DATE / TIME */
  .datetime {
    font-family:'Orbitron',monospace; font-size:13px; font-weight:700;
    color:rgba(0,212,255,0.6); letter-spacing:2px;
    margin:16px 0 8px; text-align:center;
  }

  /* DIVIDER */
  .divider {
    width:100%; height:1px; margin:8px 0 24px;
    background:linear-gradient(90deg,transparent,rgba(255,107,0,0.4),rgba(0,212,255,0.4),transparent);
  }

  /* MISSION CARDS */
  .missions { width:100%; display:flex; flex-direction:column; gap:16px; }

  .mission-card {
    width:100%; border-radius:20px; overflow:hidden;
    border:2px solid transparent;
    position:relative; cursor:pointer;
    transition:transform .2s, box-shadow .2s;
    text-decoration:none; display:block;
    -webkit-tap-highlight-color:transparent;
  }
  .mission-card:active { transform:scale(0.97); }

  /* Card glow on tap */
  .mission-card.matin {
    background:linear-gradient(#0A0A1A,#0A0A1A) padding-box,
               linear-gradient(135deg,#C8960C,#FFD700) border-box;
    box-shadow:0 8px 32px rgba(200,150,12,0.2);
  }
  .mission-card.devoirs {
    background:linear-gradient(#0A0A1A,#0A0A1A) padding-box,
               linear-gradient(135deg,#FF6B00,#FF4500) border-box;
    box-shadow:0 8px 32px rgba(255,107,0,0.2);
  }
  .mission-card.soir {
    background:linear-gradient(#0A0A1A,#0A0A1A) padding-box,
               linear-gradient(135deg,#1E90FF,#00D4FF) border-box;
    box-shadow:0 8px 32px rgba(0,212,255,0.2);
  }

  .card-inner {
    display:flex; align-items:center; gap:16px; padding:18px 20px;
  }

  .card-icon-wrap {
    width:64px; height:64px; border-radius:16px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  .matin .card-icon-wrap { background:linear-gradient(135deg,#3A2200,#5C3A10); border:2px solid rgba(200,150,12,0.5); }
  .devoirs .card-icon-wrap { background:linear-gradient(135deg,#1A0A00,#3A1A00); border:2px solid rgba(255,107,0,0.5); }
  .soir .card-icon-wrap { background:linear-gradient(135deg,#000A1A,#001A3A); border:2px solid rgba(0,212,255,0.5); }

  .card-icon-wrap img { width:44px; height:44px; object-fit:contain; filter:brightness(1.2); }

  .card-text { flex:1; }
  .card-label {
    font-size:10px; font-weight:800; letter-spacing:2px;
    text-transform:uppercase; margin-bottom:4px;
  }
  .matin .card-label { color:rgba(200,150,12,0.7); }
  .devoirs .card-label { color:rgba(255,107,0,0.7); }
  .soir .card-label { color:rgba(0,212,255,0.7); }

  .card-title {
    font-family:'Bangers',cursive; font-size:26px; letter-spacing:2px;
    line-height:1; margin-bottom:4px;
  }
  .matin .card-title { color:#FFD700; filter:drop-shadow(0 0 6px rgba(200,150,12,0.5)); }
  .devoirs .card-title { color:#FF8040; filter:drop-shadow(0 0 6px rgba(255,107,0,0.5)); }
  .soir .card-title { color:#40D4FF; filter:drop-shadow(0 0 6px rgba(0,212,255,0.5)); }

  .card-sub { font-size:11px; font-weight:700; color:rgba(255,255,255,0.4); }

  .card-arrow {
    font-size:24px; flex-shrink:0;
    animation:pulse-arrow 1.5s infinite alternate;
  }
  @keyframes pulse-arrow { 0%{opacity:0.4;transform:translateX(0)} 100%{opacity:1;transform:translateX(4px)} }
  .matin .card-arrow { color:rgba(200,150,12,0.6); }
  .devoirs .card-arrow { color:rgba(255,107,0,0.6); }
  .soir .card-arrow { color:rgba(0,212,255,0.6); }

  /* Active mission indicator */
  .active-badge {
    position:absolute; top:10px; right:12px;
    font-size:9px; font-weight:800; letter-spacing:1px;
    padding:3px 8px; border-radius:10px; text-transform:uppercase;
    display:none;
  }
  .active-badge.show { display:block; animation:pulse-badge 1s infinite alternate; }
  @keyframes pulse-badge { 0%{opacity:0.6} 100%{opacity:1} }
  .matin .active-badge { background:rgba(200,150,12,0.2); color:#FFD700; border:1px solid rgba(200,150,12,0.4); }
  .devoirs .active-badge { background:rgba(255,107,0,0.2); color:#FF8040; border:1px solid rgba(255,107,0,0.4); }
  .soir .active-badge { background:rgba(0,212,255,0.2); color:#40D4FF; border:1px solid rgba(0,212,255,0.4); }

  /* FOOTER */
  .footer {
    margin-top:30px; text-align:center;
    font-size:10px; font-weight:700; letter-spacing:1px;
    color:rgba(255,255,255,0.15); text-transform:uppercase;
  }
</style>
</head>
<body>

<div class="starfield" id="starfield"></div>

<div class="container">

<script>
  // Stars
  const sf = document.getElementById('starfield');
  for(let i=0;i<60;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=Math.random()*2+0.5;
    s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.top=(Math.random()*100)+'%'; s.style.left=(Math.random()*100)+'%';
    s.style.setProperty('--dur',(2+Math.random()*4)+'s');
    s.style.animationDelay=(Math.random()*4)+'s';
    sf.appendChild(s);
  }

  // Clock
  function updateTime(){
    const now=new Date();
    const days=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    const h=String(now.getHours()).padStart(2,'0');
    const m=String(now.getMinutes()).padStart(2,'0');
    document.getElementById('datetime').textContent=
      days[now.getDay()]+' — '+h+':'+m;

    // Show active mission badge based on time
    const hour=now.getHours();
    document.getElementById('badge-matin').classList.toggle('show', hour>=6 && hour<9);
    document.getElementById('badge-devoirs').classList.toggle('show', hour>=16 && hour<19);
    document.getElementById('badge-soir').classList.toggle('show', hour>=19 && hour<22);
  }
  updateTime();
  setInterval(updateTime, 30000);
</script>
